<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  cc-computer-use —— 随包自带的 AT-SPI 私有总线配置

  为什么必须自带一份，而不是用系统那份
  ----------------------------------
  系统那份在 /usr/share/defaults/at-spi2/accessibility.conf，**属 at-spi2-core 包**：
  我们再写一份就是 dpkg 文件冲突（在有 GNOME 的机器上安装直接失败），而本包的目标机器
  常常取不到 apt 源、没办法补救。何况目标机可能压根没装 at-spi2-core。

  它在什么时候被用到
  ----------------
  display 启动沙箱时，用 `dbus-daemon --config-file <本文件> --nofork --address <私有 socket>`
  起一条**私有**的 AT-SPI 总线，再手工拉起 at-spi2-registryd 连上去。于是沙箱内的应用
  上报的无障碍信息全落在这条私有线路上，宿主会话总线完全看不到它们 —— 这是避免
  「遍历沙箱应用的 a11y 树把宿主 GNOME Shell 打崩」的关键。

  与系统版本的差异（两处，都是刻意的）
  ----------------------------------
  · 去掉 <servicedir>：那是给 D-Bus **服务激活**用的，指向 at-spi2-core 提供的
    /usr/share/dbus-1/accessibility-services。我们从不走服务激活 —— registryd 由
    调用方手工拉起（见 core/display/at_spi_bus.py），所以这个依赖不需要，
    去掉才能真的自包含。
  · 去掉 <listen>：调用方总是显式传 `--address`（一条 /tmp 下的私有 socket）。
    留一个 <listen> 只会让「到底监听在哪」有两种说法。

  其余策略与限额原样保留自系统的 at-spi2-core 2.52 版本 —— 这是一份**已知可用**的配置，
  逐字保留是风险最低的做法。
-->
<busconfig>

  <type>accessibility</type>

  <auth>EXTERNAL</auth>

  <policy context="default">
    <!-- Allow root to connect -->
    <allow user="root"/>
    <!-- Allow everything to be sent -->
    <allow send_destination="*" eavesdrop="true"/>
    <!-- Allow everything to be received -->
    <allow eavesdrop="true"/>
    <!-- Allow anyone to own anything -->
    <allow own="*"/>
  </policy>

  <limit name="max_incoming_bytes">1000000000</limit>
  <limit name="max_outgoing_bytes">1000000000</limit>
  <limit name="max_message_size">1000000000</limit>
  <limit name="service_start_timeout">120000</limit>
  <limit name="auth_timeout">240000</limit>
  <limit name="max_completed_connections">100000</limit>
  <limit name="max_incomplete_connections">10000</limit>
  <limit name="max_connections_per_user">100000</limit>
  <limit name="max_pending_service_starts">10000</limit>
  <limit name="max_names_per_connection">50000</limit>
  <limit name="max_match_rules_per_connection">50000</limit>
  <limit name="max_replies_per_connection">50000</limit>
  <limit name="reply_timeout">300000</limit>
</busconfig>
